version: "3.8"

services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres123@db:5432/multichat
      - JWT_SECRET=change-this-secret-in-production
      - ADMIN_NAME=Administrador
      - ADMIN_EMAIL=admin@contabilidade.com
      - ADMIN_PASSWORD=senha123
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_DB=multichat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d multichat"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
